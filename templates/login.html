<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | PRODI Salud</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_reporte.css') }}">
    <style>
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-secondary);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--color-accent);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--color-accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success-msg {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body class="dashboard-container"
    style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="glass-card login-box">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="PRODI"
                style="height: 60px; margin-bottom: 15px;">
            <h1 style="color: rgb(2, 2, 2); font-size: 1.5rem; border: none; padding: 0;">Iniciar Sesión</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="{{ category }}-msg">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label style="color: black;">Email</label>
                <input type="email" name="email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label style="color: black;">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Ingresar</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
            <span style="opacity: 0.6;">¿No tienes cuenta?</span>
            <a href="/registro" style="color: var(--color-accent); text-decoration: none; font-weight: bold;">Regístrate
                aquí</a>
        </div>
    </div>
</body>

</html>
