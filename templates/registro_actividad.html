<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Actividad | Prodi Salud</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .phone-container {
            width: 100%;
            max-width: 430px;
            background: var(--bg);
            min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
            padding: 24px;
            position: relative;
        }

        header {
            margin-bottom: 32px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .activity-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: #f1f5f9;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .intensity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .intensity-btn {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #f1f5f9;
            text-align: center;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            transition: all 0.2s;
        }

        .intensity-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .save-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .save-btn:hover {
            transform: translateY(-2px);
            background: var(--primary-dark);
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }

        .history-icon {
            width: 48px;
            height: 48px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .history-info {
            flex: 1;
        }

        .history-info h3 {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .history-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .history-meta {
            text-align: right;
        }

        .history-meta span {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .history-meta small {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <header>
        <a href="{{ url_for('landing_usuario') }}" class="back-link">
            <i class="fas fa-chevron-left"></i> Volver al Dashboard
        </a>
        <h1>Registro de Actividad</h1>
    </header>

    <div class="activity-card">
        <form id="activityForm">
            <div class="form-group">
                <label>Tipo de Actividad</label>
                <select id="tipo_actividad" required>
                    <option value="">Selecciona...</option>
                    <option value="Caminar">Caminar</option>
                    <option value="Correr">Correr</option>
                    <option value="Bicicleta">Bicicleta</option>
                    <option value="Gimnasio/Pesas">Gimnasio / Pesas</option>
                    <option value="Natación">Natación</option>
                    <option value="Yoga/Pilates">Yoga / Pilates</option>
                    <option value="Deporte en equipo">Deporte en equipo</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label>Duración (minutos)</label>
                <input type="number" id="duracion" placeholder="Ej: 45" required min="1">
            </div>

            <div class="form-group">
                <label>Intensidad</label>
                <div class="intensity-grid">
                    <div class="intensity-btn" onclick="setIntensidad('Baja', this)">Baja</div>
                    <div class="intensity-btn active" onclick="setIntensidad('Media', this)">Media</div>
                    <div class="intensity-btn" onclick="setIntensidad('Alta', this)">Alta</div>
                </div>
                <input type="hidden" id="intensidad" value="Media">
            </div>

            <button type="submit" class="save-btn">Guardar Actividad</button>
        </form>
    </div>

    <div class="section-header" style="font-weight: 800; font-size: 1.1rem; margin-bottom: 16px;">Actividades Recientes</div>
    
    <div id="activityHistory">
        <!-- populated by JS -->
    </div>
</div>

<script>
    let intensidadSelected = 'Media';

    function setIntensidad(val, el) {
        intensidadSelected = val;
        document.getElementById('intensidad').value = val;
        document.querySelectorAll('.intensity-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
    }

    document.getElementById('activityForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.disabled = true;
        btn.innerText = 'Guardando...';

        const data = {
            tipo: document.getElementById('tipo_actividad').value,
            duracion: parseInt(document.getElementById('duracion').value),
            intensidad: intensidadSelected
        };

        try {
            const res = await fetch('/api/registro_actividad', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                btn.innerText = '✓ Guardado';
                btn.style.background = '#10b981';
                setTimeout(() => {
                    location.reload();
                }, 1000);
            }
        } catch (err) {
            console.error(err);
            btn.disabled = false;
            btn.innerText = 'Reintentar';
        }
    };

    async function loadHistory() {
        try {
            const res = await fetch('/api/historial_actividad');
            const data = await res.json();
            const container = document.getElementById('activityHistory');
            
            if (data.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">Aún no has registrado actividades hoy.</p>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="history-item">
                    <div class="history-icon">
                        <i class="fas ${getIcon(item.tipo)}"></i>
                    </div>
                    <div class="history-info">
                        <h3>${item.tipo}</h3>
                        <p>${item.intensidad}</p>
                    </div>
                    <div class="history-meta">
                        <span>${item.duracion} min</span>
                        <small>${item.calorias_est} kcal</small>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            console.error(err);
        }
    }

    function getIcon(tipo) {
        const icons = {
            'Caminar': 'fa-walking',
            'Correr': 'fa-running',
            'Bicicleta': 'fa-bicycle',
            'Gimnasio/Pesas': 'fa-dumbbell',
            'Natación': 'fa-swimmer',
            'Yoga/Pilates': 'fa-spa',
            'Deporte en equipo': 'fa-users',
            'Otro': 'fa-fire'
        };
        return icons[tipo] || 'fa-fire';
    }

    loadHistory();
</script>

</body>
</html>
