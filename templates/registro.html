<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | PRODI Salud</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_reporte.css') }}">
    <style>
        .register-box {
            max-width: 450px;
            margin: 50px auto;
            padding: 40px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-secondary);
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--color-accent);
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            background: var(--color-accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-register:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .note {
            font-size: 0.8rem;
            color: var(--color-secondary);
            opacity: 0.7;
            margin-bottom: 15px;
        }
    </style>
</head>

<body class="dashboard-container"
    style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="glass-card register-box">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="PRODI"
                style="height: 60px; margin-bottom: 15px;">
            <h1 style="color: rgb(0, 0, 0); font-size: 1.5rem; border: none; padding: 0;">Registro de Nuevo Usuario</h1>
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/registro" method="POST">
            <div class="form-group">
                <label style="color: black;">Email</label>
                <input type="email" name="email" required placeholder="tu@email.com">
                <p class="note" style="color: black;">Usa el mismo email con el que completaste tu encuesta original.
                </p>
            </div>
            <div class="form-group">
                <label style="color: black;">Contraseña</label>
                <input type="password" name="password" required placeholder="Mínimo 8 caracteres">
            </div>
            <div class="form-group">
                <label style="color: black;">Confirmar Contraseña</label>
                <input type="password" name="confirm_password" required placeholder="Repite tu contraseña">
            </div>
            <button type="submit" class="btn-register">Crear Cuenta</button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
            <span style="opacity: 0.6;">¿Ya tienes cuenta?</span>
            <a href="/login" style="color: var(--color-accent); text-decoration: none; font-weight: bold;">Inicia
                sesión</a>
        </div>
    </div>
</body>

</html>
